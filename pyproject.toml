[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panupgrade"
version = "0.1.0.dev0"
description = "Plan (and later run) PAN-OS upgrades across a Panorama-managed fleet: report first, change only on explicit say-so."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl"]

[project.scripts]
panupgrade = "panupgrade.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
panupgrade = ["data/*.json"]
