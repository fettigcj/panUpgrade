# panupgrade settings. Copy to your own file and pass it with --settings FILE; any line you delete keeps its default.
# One-off changes can be made on the command line instead:  --set name=value
# Secrets never go here (credentials are named accounts in the credentials file, passed by path).

# ---- HA behaviour --------------------------------------------------------------------------------------------
failover_band      = 0.30      # after failing the active member over, the new active node's sessions must be within +/-30% of before
post_upgrade_band  = 0.50      # after the upgrade, the active node's sessions must be within +/-50% of the pair's baseline
pair_tolerate_asymmetry = false   # Allow Asymmetric Return During Upgrade Window for HA pairs: record, then set tcp-reject-non-syn no + asymmetric-path bypass (committed on the firewall) for the window, and put both back afterwards
group_tolerate_asymmetry = true   # the same for stand-alone groups (nearly mandatory: a group has no HA2 link)
group_reboot_tolerance = 1        # how many members of one stand-alone group may be out of service at the same time
lb_drain_profile = ""             # the interface management profile a load balancer's probe relies on; set: take the probe's protocol out of it before a group member reboots (empty = never drain)
lb_drain_probe_protocol = "ssh"   # what the balancer probes with: ssh | http | https | ssh+http | ssh+https | http+https | ssh+http+https | ping
lb_drain_wait_s = 60              # how long to wait for the balancer to drain the member after the profile changed
upgrade_suspended  = true      # a member that is suspended carries no traffic: upgrade it like a passive member (false = block it until it is functional)
restore_roles      = "leave"   # once both members are done: leave | restore (fail back to the original active)
sync_to_peer       = "Both"    # force the passive member to match the active one: Disable (never) | Both (in `prepare` AND again during the upgrade) | UpgradeOnly (only during the upgrade)
sync_timeout_s     = 600
ha_config_unsynced = "block"   # only used when sync_to_peer = Disable. A pair whose passive config is not synchronized: block (refuse to plan it; default) | warn (flag the failover moment on the active member, accepted when you prepare the batch)
sync_content       = "prepare" # HA members must run the same dynamic content and PAN-OS must agree; prepare installs the latest on both (listed in the one approval prompt) | never. A mismatch GATES the config sync.

# ---- Panorama range (advice only; never blocks an upgrade) ---------------------------------------------------
spread_limit       = 2         # advise when a firewall is more than this many versions behind Panorama, counted in the unit below
panorama_compare   = "minor"   # the unit for that, and for "Panorama older than the target": minor (feature releases: 12.2, 12.1, 11.2 are within 2 of each other) | major (12 vs 10)

# ---- Failure handling ----------------------------------------------------------------------------------------
max_failures       = 5         # stop starting new devices after this many have failed
max_parallel       = 5         # units (an HA pair is one unit, its members in series) worked on at the same time; the next starts as soon as one finishes
pending_changes    = "block"   # uncommitted candidate config on a firewall: block | warn | ignore

# ---- Downgrades ----------------------------------------------------------------------------------------------
delete_unneeded_images         = false   # prepare deletes PAN-OS images this upgrade does not need (keeps running, base images, path, target)
blocked_peer                   = "block"   # block | warn: a member whose HA peer is blocked by a check is held too (block) or only flagged
allow_downgrade                = false   # install a release older than the one running (across feature releases too, by the skip rule)

# ---- Images, disk, time --------------------------------------------------------------------------------------
image_source       = "firewall"  # who downloads the image: firewall (from the vendor) | panorama
min_free_disk_mb   = 4096
download_timeout_s = 3600
install_timeout_s  = 3600
reboot_timeout_s   = 1920
poll_interval_s    = 15          # how often a running job or a rebooting firewall is checked
backup_dir         = "backups"   # verified config backups are written here before anything changes
approval_max_age_hours = 168     # an approval is refused after this long (a week); 0 = never expires
